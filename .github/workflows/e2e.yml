name: E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC — catches cookie expiry early so you can refresh the secret.
    - cron: "0 6 * * 1"

jobs:
  extension-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: test/package-lock.json

      - name: Sanity-check secret is set
        env:
          YT_COOKIES_JSON: ${{ secrets.YT_COOKIES_JSON }}
        run: |
          if [ -z "$YT_COOKIES_JSON" ]; then
            echo "::error::YT_COOKIES_JSON repo secret is empty. Record via test/record-cookies.sh and run 'gh secret set YT_COOKIES_JSON < cookies.json'."
            exit 1
          fi

      - name: Materialize cookies.json
        env:
          YT_COOKIES_JSON: ${{ secrets.YT_COOKIES_JSON }}
        run: printf '%s' "$YT_COOKIES_JSON" > test/cookies.json

      - name: Install test deps
        working-directory: test
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: test
        run: npx playwright install --with-deps chromium

      - name: Run extension-only spec
        working-directory: test
        run: npx playwright test extension-only.spec.ts --reporter=list

      - name: Upload Playwright output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: /tmp/pw-out
          retention-days: 14
          if-no-files-found: ignore
